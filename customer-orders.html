
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | Edesvino Marketplace</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    main {
      max-width: 760px;
      margin: 25px auto;
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.07);
    }

    h1 { margin-top: 0; }

    .intro {
      color: #6b7280;
      line-height: 1.5;
    }

    .order {
      border: 1px solid #e5e7eb;
      border-radius: 9px;
      padding: 16px;
      margin: 15px 0;
      overflow-wrap: anywhere;
    }

    .order h2 {
      font-size: 18px;
      margin-top: 0;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      background: #f3f4f6;
      border-radius: 5px;
    }

    .message {
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    button {
      padding: 11px 16px;
      border: 0;
      border-radius: 6px;
      background: #166534;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    a { color: #166534; }

    .top-link { margin-bottom: 20px; }
  </style>
</head>
<body>
  <main>
    <div class="top-link">
      <a href="./index.html">Back to Marketplace</a>
    </div>

    <h1>My Orders</h1>
    <p class="intro">
      Welcome to your Edesvino order history.
    </p>

    <p id="message" class="message" aria-live="polite">
      Checking your login...
    </p>

    <div id="orders"></div>

    <button id="retryButton" type="button" hidden>
      Try Again
    </button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://lxszilqypuglxyfyukdg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

    const message = document.getElementById("message");
    const ordersContainer = document.getElementById("orders");
    const retryButton = document.getElementById("retryButton");

    let client = null;

    function showMessage(text, color = "#1f2937") {
      message.textContent = text;
      message.style.color = color;
    }

    function showRetry() {
      retryButton.hidden = false;
    }

    try {
      if (!window.supabase) {
        throw new Error(
          "Supabase did not load. Check your internet connection and reload."
        );
      }

      client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            storage: window.localStorage
          }
        }
      );
    } catch (error) {
      showMessage("Setup error: " + error.message, "#b91c1c");
      showRetry();
    }

    async function loadOrders() {
      retryButton.hidden = true;
      ordersContainer.replaceChildren();
      showMessage("Checking your saved login session...");

      if (!client) {
        showMessage(
          "Supabase could not start. Reload the page and try again.",
          "#b91c1c"
        );
        showRetry();
        return;
      }

      try {
        // Read the session saved in this browser first.
        const { data: sessionData, error: sessionError } =
          await client.auth.getSession();

        if (sessionError) {
          throw new Error(
            "Could not read the saved session: " +
            sessionError.message
          );
        }

        let session = sessionData.session;

        // If necessary, try to restore the session from Supabase.
        if (!session) {
          const { data: refreshed, error: refreshError } =
            await client.auth.refreshSession();

          if (refreshError) {
            throw new Error(
              "Your saved session could not be restored. Please log in again. Details: " +
              refreshError.message
            );
          }

          session = refreshed.session;
        }

        if (!session || !session.user) {
          showMessage(
            "No saved login was found in this browser. Please log in again.",
            "#b91c1c"
          );
          showRetry();
          return;
        }

        const user = session.user;
        showMessage("Loading your orders...");

        const { data: orders, error: ordersError } =
          await client
            .from("orders")
            .select("id, product_name, total_amount, status")
            .eq("customer_id", user.id)
            .order("id", { ascending: false });

        if (ordersError) {
          throw new Error(
            "Your login is active, but orders could not be loaded: " +
            ordersError.message
          );
        }

        if (!orders || orders.length === 0) {
          showMessage(
            "You're signed in, but no orders are linked to this account yet."
          );
          return;
        }

        for (const order of orders) {
          const card = document.createElement("section");
          card.className = "order";

          const heading = document.createElement("h2");
          heading.textContent = "Order #" + order.id;
          card.appendChild(heading);

          const product = document.createElement("p");
          product.textContent =
            "Product: " + (order.product_name || "Order items");
          card.appendChild(product);

          const total = document.createElement("p");
          const amount = Number(order.total_amount);

          total.textContent =
            "Total: " +
            (Number.isFinite(amount)
              ? amount.toLocaleString("en-NG", {
                  style: "currency",
                  currency: "NGN"
                })
              : "Amount unavailable");

          card.appendChild(total);

          const status = document.createElement("p");
          status.className = "status";
          status.textContent =
            "Status: " + (order.status || "Pending");
          card.appendChild(status);

          ordersContainer.appendChild(card);
        }

        showMessage("Your orders have loaded successfully.", "#166534");

      } catch (error) {
        showMessage(
          "Unable to load your orders: " +
          (error.message || "Please try again."),
          "#b91c1c"
        );
        showRetry();
      }
    }

    retryButton.addEventListener("click", loadOrders);
    loadOrders();
  </script>
</body>
</html>
