
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | Edesvino Marketplace</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
      margin: 0;
      padding: 18px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    header {
      background: #166534;
      color: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    .links {
      margin: 18px 0;
    }

    a {
      color: #166534;
      font-weight: bold;
    }

    .panel, .order-card {
      background: white;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 16px;
      overflow-wrap: anywhere;
    }

    .order-card {
      border: 1px solid #ddd;
    }

    .order-card h2 {
      margin-top: 0;
      color: #166534;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      display: inline-block;
      background: #fef3c7;
      padding: 7px 12px;
      border-radius: 6px;
    }

    button {
      background: #166534;
      color: white;
      border: 0;
      border-radius: 7px;
      padding: 12px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>My Orders</h1>
      <p>Welcome to your Edesvino order history.</p>
    </header>

    <nav class="links">
      <a href="./index.html">Back to Marketplace</a>
    </nav>

    <section id="message" class="panel" aria-live="polite">
      Checking your account...
    </section>

    <section id="orders"></section>

    <button id="retryButton" class="hidden" type="button">
      Try Again
    </button>
  </main>

  <script>
    const SUPABASE_URL =
      "https://lxszilqypuglxyfyukdg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_s0nFQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const message = document.getElementById("message");
    const ordersBox = document.getElementById("orders");
    const retryButton = document.getElementById("retryButton");

    function showMessage(text) {
      message.textContent = text;
    }

    function showError(text) {
      showMessage(text);
      retryButton.classList.remove("hidden");
    }

    function formatMoney(value) {
      return "₦" + Number(value || 0).toLocaleString("en-NG", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    async function loadOrders() {
      ordersBox.replaceChildren();
      retryButton.classList.add("hidden");
      showMessage("Loading your orders...");

      try {
        const { data: authData, error: authError } =
          await db.auth.getUser();

        if (authError) {
          showError("Unable to verify your login. Please try again.");
          return;
        }

        if (!authData.user) {
          showMessage("Please log in before viewing your orders.");

          const loginLink = document.createElement("a");
          loginLink.href = "./customer-login.html";
          loginLink.textContent = "Go to Customer Login";

          message.appendChild(document.createElement("br"));
          message.appendChild(document.createElement("br"));
          message.appendChild(loginLink);
          return;
        }

        const { data: orders, error } = await db
          .from("orders")
          .select("id, product_name, total_amount, status")
          .eq("customer_id", authData.user.id)
          .order("id", { ascending: false });

        if (error) {
          showError(
            "We couldn't load your orders. Supabase may need a secure policy allowing customers to read only their own orders. Details: " +
            error.message
          );
          return;
        }

        if (!orders || orders.length === 0) {
          showMessage("You have no orders yet.");
          return;
        }

        showMessage("Your orders: " + orders.length);

        orders.forEach(function(order) {
          const card = document.createElement("article");
          card.className = "order-card";

          const title = document.createElement("h2");
          title.textContent = "Order #" + order.id;

          const product = document.createElement("p");
          product.textContent =
            "Product: " + (order.product_name || "Order items");

          const total = document.createElement("p");
          total.className = "total";
          total.textContent =
            "Total: " + formatMoney(order.total_amount);

          const status = document.createElement("p");
          status.className = "status";
          status.textContent =
            "Status: " + (order.status || "Pending");

          card.appendChild(title);
          card.appendChild(product);
          card.appendChild(total);
          card.appendChild(status);

          ordersBox.appendChild(card);
        });

      } catch (error) {
        showError(
          "A connection problem occurred. Please check your internet connection and try again."
        );
      }
    }

    retryButton.addEventListener("click", loadOrders);

    loadOrders();
  </script>
</body>
</html>
