<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Orders | Edesvino Marketplace</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:15px;font-family:Arial,sans-serif;background:#f3f4f6;color:#1f2937}
main{max-width:760px;margin:20px auto;padding:20px;background:white;border-radius:12px}
a{color:#166534}
.top-link{margin-bottom:20px}
.message{line-height:1.6;overflow-wrap:anywhere}
.order{border:1px solid #ddd;border-radius:9px;padding:15px;margin:15px 0;overflow-wrap:anywhere}
.item{padding:10px 0;border-bottom:1px solid #eee;line-height:1.5}
.status{display:inline-block;padding:6px;background:#f3f4f6;border-radius:5px}
button{padding:12px 16px;border:0;border-radius:6px;background:#166534;color:white;font-size:15px;margin-top:8px}
button:disabled{opacity:.6}
.confirmation{color:#166534}
</style>
</head>
<body>
<main>
<div class="top-link">
<a href="./index.html">Back to Marketplace</a>
 |
<a href="./track-order.html">Track an Order</a>
</div>

<h1>My Orders</h1>
<p>Welcome to your Edesvino order history.</p>

<p id="message" class="message" aria-live="polite">
Starting order history...
</p>

<div id="orders"></div>
<button id="retryButton" hidden type="button">Try Again</button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";

const SUPABASE_URL="https://lxszilqypuglxyfyukdg.supabase.co";
const SUPABASE_KEY="sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

const message=document.getElementById("message");
const ordersBox=document.getElementById("orders");
const retryButton=document.getElementById("retryButton");

let client=null;

function showMessage(text,color){
  message.textContent=text;
  if(color) message.style.color=color;
}

function money(value){
  const amount=Number(value);
  if(!Number.isFinite(amount)) return "Amount unavailable";
  return amount.toLocaleString("en-NG",{
    style:"currency",
    currency:"NGN"
  });
}

function withTimeout(promise,ms){
  return Promise.race([
    promise,
    new Promise((_,reject)=>{
      setTimeout(()=>reject(
        new Error("The request took too long. Check your internet and try again.")
      ),ms);
    })
  ]);
}

try{
  if(!window.supabase){
    throw new Error("Supabase could not load. Check your internet connection.");
  }

  client=window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true,
        storage:window.localStorage
      }
    }
  );
}catch(error){
  showMessage("Setup error: "+error.message,"#b91c1c");
  retryButton.hidden=false;
}

async function confirmDelivery(orderId,button,feedback){
  button.disabled=true;
  button.textContent="Confirming...";

  try{
    const result=await withTimeout(
      client.rpc("confirm_order_delivery",{p_order_id:orderId}),
      15000
    );

    if(result.error) throw result.error;

    if(result.data && result.data.success===false){
      throw new Error(result.data.message||"Confirmation failed.");
    }

    feedback.textContent=
      (result.data && result.data.message) ||
      "Delivery confirmed successfully.";

    feedback.style.color="#166534";

    await loadOrders();

  }catch(error){
    feedback.textContent="Could not confirm delivery: "+error.message;
    feedback.style.color="#b91c1c";
    button.disabled=false;
    button.textContent="Confirm Delivery";
  }
}

async function loadOrders(){
  retryButton.hidden=true;
  ordersBox.replaceChildren();

  showMessage("Checking your saved login session...");

  if(!client){
    showMessage("Supabase could not start. Reload the page.","#b91c1c");
    retryButton.hidden=false;
    return;
  }

  try{
    const sessionResult=await withTimeout(
      client.auth.getSession(),10000
    );

    if(sessionResult.error) throw sessionResult.error;

    let session=sessionResult.data.session;

    if(!session){
      await new Promise(resolve=>setTimeout(resolve,1000));

      const retry=await withTimeout(
        client.auth.getSession(),10000
      );

      if(retry.error) throw retry.error;
      session=retry.data.session;
    }

    if(!session || !session.user){
      showMessage(
        "Please log in before viewing your orders.",
        "#b91c1c"
      );
      retryButton.hidden=false;
      return;
    }

    showMessage("Loading your orders...");

    const result=await withTimeout(
      client.from("orders")
        .select("id,product_name,total_amount,status,payment_status,delivery_confirmed_at,dispute_status")
        .eq("customer_id",session.user.id)
        .order("id",{ascending:false}),
      15000
    );

    if(result.error) throw result.error;

    const orders=result.data||[];

    if(orders.length===0){
      showMessage("No orders are linked to this customer account yet.");
      return;
    }

    const ids=orders.map(order=>order.id);

    const itemResult=await withTimeout(
      client.from("order_items")
        .select("order_id,product_name,price,quantity")
        .in("order_id",ids),
      15000
    );

    if(itemResult.error) throw itemResult.error;

    const itemsByOrder={};

    for(const item of(itemResult.data||[])){
      const id=String(item.order_id);
      if(!itemsByOrder[id]) itemsByOrder[id]=[];
      itemsByOrder[id].push(item);
    }

    for(const order of orders){
      const card=document.createElement("section");
      card.className="order";

      const heading=document.createElement("h2");
      heading.textContent="Order #"+order.id;
      card.appendChild(heading);

      const items=itemsByOrder[String(order.id)]||[];

      if(items.length){
        const itemsHeading=document.createElement("h3");
        itemsHeading.textContent="Items";
        card.appendChild(itemsHeading);

        for(const item of items){
          const row=document.createElement("div");
          row.className="item";

          const name=document.createElement("strong");
          name.textContent=item.product_name||"Product";
          row.appendChild(name);

          const quantity=Number(item.quantity)||1;
          const price=Number(item.price);

          const details=document.createElement("p");
          details.textContent="Quantity: "+quantity+" × "+money(price);
          row.appendChild(details);

          const subtotal=document.createElement("p");
          subtotal.textContent="Subtotal: "+money(price*quantity);
          row.appendChild(subtotal);

          card.appendChild(row);
        }
      }else{
        const note=document.createElement("p");
        note.textContent="No individual items were found for this order.";
        card.appendChild(note);
      }

      const total=document.createElement("p");
      total.textContent="Order total: "+money(order.total_amount);
      card.appendChild(total);

      const status=document.createElement("p");
      status.className="status";
      status.textContent="Order status: "+(order.status||"Pending");
      card.appendChild(status);

      const payment=document.createElement("p");
      payment.textContent="Payment status: "+(order.payment_status||"Pending");
      card.appendChild(payment);

      const delivered=
        String(order.status||"").trim().toLowerCase()==="delivered";

      const paid=[
        "success","successful","paid","completed"
      ].includes(
        String(order.payment_status||"").trim().toLowerCase()
      );

      const dispute=String(order.dispute_status||"none")
        .trim().toLowerCase();

      if(order.delivery_confirmed_at){
        const confirmed=document.createElement("p");
        confirmed.className="confirmation";
        confirmed.textContent="✓ You confirmed delivery of this order.";
        card.appendChild(confirmed);

      }else if(delivered && paid && (!dispute||dispute==="none")){
        const explanation=document.createElement("p");
        explanation.textContent=
          "Confirm only after you have received your order.";
        card.appendChild(explanation);

        const feedback=document.createElement("p");
        feedback.className="message";
        feedback.setAttribute("aria-live","polite");

        const button=document.createElement("button");
        button.type="button";
        button.textContent="Confirm Delivery";

        button.addEventListener("click",()=>{
          if(confirm("Have you received all items in Order #"+order.id+"?")){
            confirmDelivery(order.id,button,feedback);
          }
        });

        card.appendChild(button);
        card.appendChild(feedback);

      }else if(delivered && !paid){
        const note=document.createElement("p");
        note.textContent=
          "Delivery confirmation is unavailable until payment is verified.";
        card.appendChild(note);

      }else if(delivered && dispute && dispute!=="none"){
        const note=document.createElement("p");
        note.textContent=
          "Delivery confirmation is unavailable while this order has a dispute.";
        card.appendChild(note);
      }

      ordersBox.appendChild(card);
    }

    showMessage(
      "Your orders and item details have loaded successfully.",
      "#166534"
    );

  }catch(error){
    showMessage(
      "Unable to load your orders: "+
      (error.message||"Please try again."),
      "#b91c1c"
    );
    retryButton.hidden=false;
  }
}

retryButton.addEventListener("click",loadOrders);
loadOrders();

})();
</script>
</body>
</html>
