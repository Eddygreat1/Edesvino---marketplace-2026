
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | Edesvino Marketplace</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    main {
      max-width: 760px;
      margin: 25px auto;
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.07);
    }

    h1 { margin-top: 0; }

    .intro {
      color: #6b7280;
      line-height: 1.5;
    }

    .order {
      border: 1px solid #e5e7eb;
      border-radius: 9px;
      padding: 16px;
      margin: 15px 0;
      overflow-wrap: anywhere;
    }

    .order h2 {
      font-size: 18px;
      margin-top: 0;
    }

    .item {
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
      line-height: 1.5;
    }

    .item:last-child { border-bottom: 0; }

    .status {
      display: inline-block;
      padding: 5px 9px;
      background: #f3f4f6;
      border-radius: 5px;
    }

    .message {
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    button {
      padding: 11px 16px;
      border: 0;
      border-radius: 6px;
      background: #166534;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    a { color: #166534; }
    .top-link { margin-bottom: 20px; }
  </style>
</head>
<body>
  <main>
    <div class="top-link">
      <a href="./index.html">Back to Marketplace</a>
    </div>

    <h1>My Orders</h1>
    <p class="intro">
      Welcome to your Edesvino order history.
    </p>

    <p id="message" class="message" aria-live="polite">
      Checking your login...
    </p>

    <div id="orders"></div>

    <button id="retryButton" type="button" hidden>
      Try Again
    </button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://lxszilqypuglxyfyukdg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

    const message = document.getElementById("message");
    const ordersContainer = document.getElementById("orders");
    const retryButton = document.getElementById("retryButton");

    let client = null;

    function showMessage(text, color = "#1f2937") {
      message.textContent = text;
      message.style.color = color;
    }

    function showRetry() {
      retryButton.hidden = false;
    }

    function formatMoney(value) {
      const amount = Number(value);
      if (!Number.isFinite(amount)) return "Amount unavailable";

      return amount.toLocaleString("en-NG", {
        style: "currency",
        currency: "NGN"
      });
    }

    try {
      if (!window.supabase) {
        throw new Error("Supabase did not load. Check your internet connection.");
      }

      client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            storage: window.localStorage
          }
        }
      );
    } catch (error) {
      showMessage("Setup error: " + error.message, "#b91c1c");
      showRetry();
    }

    async function loadOrders() {
      retryButton.hidden = true;
      ordersContainer.replaceChildren();
      showMessage("Checking your saved login session...");

      if (!client) {
        showMessage("Supabase could not start. Please reload the page.", "#b91c1c");
        showRetry();
        return;
      }

      try {
        const { data: sessionData, error: sessionError } =
          await client.auth.getSession();

        if (sessionError) {
          throw new Error("Could not read saved session: " + sessionError.message);
        }

        let session = sessionData.session;

        if (!session) {
          const { data: refreshed, error: refreshError } =
            await client.auth.refreshSession();

          if (refreshError) {
            throw new Error("Please log in again. " + refreshError.message);
          }

          session = refreshed.session;
        }

        if (!session || !session.user) {
          showMessage("Please log in before viewing your orders.", "#b91c1c");
          showRetry();
          return;
        }

        showMessage("Loading your orders...");

        const { data: orders, error: ordersError } = await client
          .from("orders")
          .select("id, product_name, total_amount, status")
          .eq("customer_id", session.user.id)
          .order("id", { ascending: false });

        if (ordersError) {
          throw new Error("Could not load orders: " + ordersError.message);
        }

        if (!orders || orders.length === 0) {
          showMessage("No orders are linked to this customer account yet.");
          return;
        }

        // Fetch items only for orders belonging to the signed-in customer.
        const orderIds = orders.map(order => order.id);

        const { data: items, error: itemsError } = await client
          .from("order_items")
          .select("order_id, product_name, price, quantity")
          .in("order_id", orderIds);

        const itemsByOrder = {};

        if (itemsError) {
  throw new Error("Could not load order items: " + itemsError.message);
}

if (items) {
          for (const item of items) {
            const id = String(item.order_id);

            if (!itemsByOrder[id]) {
              itemsByOrder[id] = [];
            }

            itemsByOrder[id].push(item);
          }
        }

        for (const order of orders) {
          const card = document.createElement("section");
          card.className = "order";

          const heading = document.createElement("h2");
          heading.textContent = "Order #" + order.id;
          card.appendChild(heading);

          const orderItems = itemsByOrder[String(order.id)] || [];

          if (orderItems.length > 0) {
            const itemsHeading = document.createElement("h3");
            itemsHeading.textContent = "Items";
            card.appendChild(itemsHeading);

            for (const item of orderItems) {
              const itemRow = document.createElement("div");
              itemRow.className = "item";

              const name = item.product_name || "Product";
              const quantity = Number(item.quantity) || 1;
              const price = Number(item.price);

              const itemName = document.createElement("strong");
              itemName.textContent = name;
              itemRow.appendChild(itemName);

              const details = document.createElement("div");
              details.textContent =
                "Quantity: " + quantity +
                " × " + formatMoney(price);
              itemRow.appendChild(details);

              const subtotal = document.createElement("div");
              subtotal.textContent =
                "Subtotal: " + formatMoney(price * quantity);
              itemRow.appendChild(subtotal);

              card.appendChild(itemRow);
            }
          } else {
            const noItems = document.createElement("p");
            noItems.textContent = itemsError
              ? "Order items could not be loaded. Please check your order details later."
              : "No individual items were found for this order.";
            card.appendChild(noItems);
          }

          const total = document.createElement("p");
          total.textContent = "Order total: " + formatMoney(order.total_amount);
          card.appendChild(total);

          const status = document.createElement("p");
          status.className = "status";
          status.textContent = "Status: " + (order.status || "Pending");
          card.appendChild(status);

          ordersContainer.appendChild(card);
        }

        showMessage(
          itemsError
            ? "Your orders loaded, but Supabase could not return the individual items."
            : "Your orders and item details have loaded successfully.",
          itemsError ? "#92400e" : "#166534"
        );

      } catch (error) {
        showMessage(
          "Unable to load your orders: " +
          (error.message || "Please try again."),
          "#b91c1c"
        );
        showRetry();
      }
    }

    retryButton.addEventListener("click", loadOrders);
    loadOrders();
  </script>
</body>
</html>
