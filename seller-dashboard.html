<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edesvino Seller Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      margin: 0;
      padding: 18px;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px #00000012;
    }

    h1, h2 { color: #147a43; }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 6px;
      font-size: 16px;
    }

    input, textarea {
      border: 1px solid #ccc;
    }

    button {
      border: 0;
      background: #147a43;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary {
      background: #555;
    }

    .product {
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
    }

    #message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #b42318;
    }

    .success { color: #147a43 !important; }

    a { color: #147a43; }
  </style>
</head>

<body>
<div class="container">

  <div class="card">
    <h1>Edesvino Seller Dashboard</h1>
    <p>Manage your products on Edesvino Marketplace.</p>
    <p id="status">Connecting to Edesvino...</p>
    <p id="message"></p>
  </div>

  <section class="card" id="loginSection">
    <h2>Owner Login</h2>
    <p>Sign in with your existing marketplace owner account.</p>

    <form id="loginForm">
      <input
        id="email"
        type="email"
        placeholder="Email Address"
        autocomplete="username"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Log In</button>
    </form>

    <p>This page does not create a new account.</p>
  </section>

  <section class="card" id="dashboardSection" hidden>
    <h2>Your Products</h2>
    <p id="accountInfo"></p>

    <button id="refreshButton" type="button">
      Refresh Products
    </button>

    <div id="productsList">Loading products...</div>

    <h2>Add a Product</h2>

    <form id="productForm">
      <input id="productName" placeholder="Product Name" required>

      <input
        id="productPrice"
        type="number"
        min="0.01"
        step="0.01"
        placeholder="Price in Naira"
        required
      >

      <input id="storeName" placeholder="Store Name" required>

      <textarea
        id="productDescription"
        placeholder="Product Description"
        rows="3"
      ></textarea>

      <input
        id="productImage"
        type="url"
        placeholder="Product Image URL (optional)"
      >

      <button type="submit">Add Product</button>
    </form>

    <button id="logoutButton" class="secondary" type="button">
      Log Out
    </button>
  </section>

  <p><a href="./">Back to Marketplace</a></p>

</div>

<script>
(function () {
  const SUPABASE_URL =
    "https://lxszilqypuglxyfyukdg.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

  const OWNER_ID =
    "b860b02d-0bf3-4b8d-87f8-965753f22f72";

  const statusEl = document.getElementById("status");
  const messageEl = document.getElementById("message");
  const loginSection = document.getElementById("loginSection");
  const dashboardSection = document.getElementById("dashboardSection");
  const productsList = document.getElementById("productsList");

  let supabaseClient;
  let currentUser = null;

  function showMessage(message, success = false) {
    messageEl.textContent = message;
    messageEl.className = success ? "success" : "";
  }

  function naira(value) {
    return "₦" + Number(value).toLocaleString("en-NG", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  async function initialize() {
    if (!window.supabase || !window.supabase.createClient) {
      statusEl.textContent = "Connection failed.";
      showMessage("The Supabase library could not load. Refresh the page and try again.");
      return;
    }

    try {
      supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      statusEl.textContent = "Connected to Edesvino.";
      showMessage("", true);

      const { data, error } = await supabaseClient.auth.getSession();

      if (error) throw error;

      if (data.session) {
        await verifyOwner(data.session.user);
      } else {
        loginSection.hidden = false;
        dashboardSection.hidden = true;
        statusEl.textContent = "Please log in with your marketplace owner account.";
      }
    } catch (error) {
      statusEl.textContent = "Connection or session check failed.";
      showMessage(error.message || "Unable to connect.");
    }
  }

  async function verifyOwner(user) {
    currentUser = user;

    if (!user || user.id !== OWNER_ID) {
      await supabaseClient.auth.signOut();
      currentUser = null;
      loginSection.hidden = false;
      dashboardSection.hidden = true;
      showMessage("This account is not the registered marketplace owner account.");
      return;
    }

    const { data, error } = await supabaseClient
      .from("platform_admins")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();

    if (error) {
      showMessage("Owner verification failed: " + error.message);
      return;
    }

    if (!data) {
      showMessage("This account was not found in platform_admins.");
      return;
    }

    loginSection.hidden = true;
    dashboardSection.hidden = false;
    statusEl.textContent = "Owner verified.";
    document.getElementById("accountInfo").textContent =
      "Signed in as " + user.email;

    showMessage("Login successful.", true);
    await loadProducts();
  }

  document.getElementById("loginForm").addEventListener("submit", async function (event) {
    event.preventDefault();
    showMessage("Signing in...");

    try {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      await verifyOwner(data.user);
    } catch (error) {
      showMessage("Login or verification failed: " + error.message);
    }
  });

  async function loadProducts() {
    if (!currentUser) return;

    productsList.textContent = "Loading products...";

    const { data, error } = await supabaseClient
      .from("products")
      .select("id, name, price, store, description, image_url")
      .eq("seller_id", currentUser.id)
      .order("id", { ascending: false });

    if (error) {
      productsList.textContent = "";
      showMessage("Could not load products: " + error.message);
      return;
    }

    productsList.innerHTML = "";

    if (!data || data.length === 0) {
      productsList.textContent = "No products found for this owner account.";
      return;
    }

    data.forEach(function (product) {
      const card = document.createElement("div");
      card.className = "product";

      const title = document.createElement("h3");
      title.textContent = product.name || "Unnamed product";

      const price = document.createElement("p");
      price.textContent = "Price: " + naira(product.price);

      const store = document.createElement("p");
      store.textContent = "Store: " + (product.store || "Not specified");

      const description = document.createElement("p");
      description.textContent = product.description || "";

      card.append(title, price, store, description);
      productsList.appendChild(card);
    });
  }

  document.getElementById("refreshButton").addEventListener("click", loadProducts);

  document.getElementById("productForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    if (!currentUser || currentUser.id !== OWNER_ID) {
      showMessage("Please sign in with the owner account first.");
      return;
    }

    const name = document.getElementById("productName").value.trim();
    const price = Number(document.getElementById("productPrice").value);
    const store = document.getElementById("storeName").value.trim();
    const description = document.getElementById("productDescription").value.trim();
    const image_url = document.getElementById("productImage").value.trim();

    if (!name || !store || !Number.isFinite(price) || price <= 0) {
      showMessage("Enter a product name, store name, and valid price.");
      return;
    }

    showMessage("Adding product...");

    const newProduct = {
      name,
      price,
      store,
      seller_id: currentUser.id,
      description,
      image_url: image_url || null
    };

    const { error } = await supabaseClient
      .from("products")
      .insert(newProduct);

    if (error) {
      showMessage("Product was not added: " + error.message);
      return;
    }

    document.getElementById("productForm").reset();
    showMessage("Product added successfully.", true);
    await loadProducts();
  });

  document.getElementById("logoutButton").addEventListener("click", async function () {
    const { error } = await supabaseClient.auth.signOut();

    currentUser = null;
    loginSection.hidden = false;
    dashboardSection.hidden = true;

    showMessage(error ? error.message : "You have logged out.", !error);
  });

  initialize();
})();
</script>
</body>
</html>
