<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Product Details | Edesvino Marketplace</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 22px 14px;
    }

    header h1 { margin: 0 0 8px; }

    main {
      max-width: 900px;
      margin: auto;
      padding: 18px 14px 35px;
    }

    .panel {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000010;
    }

    .back {
      display: inline-block;
      margin-bottom: 15px;
      color: #047857;
      font-weight: bold;
      text-decoration: none;
    }

    .product {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .product-image {
      width: 100%;
      max-height: 380px;
      min-height: 180px;
      object-fit: contain;
      border-radius: 8px;
      background: #f9fafb;
    }

    .price {
      color: #047857;
      font-size: 26px;
      font-weight: bold;
    }

    .description {
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .muted { color: #6b7280; }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      max-width: 120px;
      padding: 11px;
      font-size: 16px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
    }

    button, .button {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: 0;
      border-radius: 7px;
      background: #111827;
      color: white;
      font-weight: bold;
      font-size: 15px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .green { background: #047857; }

    #message {
      margin-top: 15px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .error { color: #b91c1c; }
    .success { color: #047857; }

    @media (max-width: 650px) {
      .product { grid-template-columns: 1fr; }
      .product-image { max-height: 300px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Edesvino Marketplace</h1>
    <p>Product Details</p>
  </header>

  <main>
    <a class="back" href="./index.html">
      ← Back to Marketplace
    </a>

    <section class="panel" id="status" aria-live="polite">
      Loading product details...
    </section>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://lxszilqypuglxyfyukdg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

    const CART_KEY = "edesvinoMarketplaceCart";

    const statusBox = document.getElementById("status");
    const messageBox = document.getElementById("message");

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function formatMoney(value) {
      const amount = Number(value);

      return Number.isFinite(amount)
        ? "₦" + amount.toLocaleString("en-NG")
        : "Price unavailable";
    }

    function getCart() {
      try {
        const cart = JSON.parse(
          localStorage.getItem(CART_KEY) || "[]"
        );

        return Array.isArray(cart) ? cart : [];
      } catch {
        return [];
      }
    }

    function addToCart(product, quantity) {
      const id = String(product.id);
      const name = String(product.name || "").trim();
      const price = Number(product.price);

      if (!name || !Number.isFinite(price) || price < 0) {
        messageBox.className = "error";
        messageBox.textContent =
          "This product has invalid information.";
        return;
      }

      const cart = getCart();

      const existing = cart.find(
        item => String(item.id) === id
      );

      if (existing) {
        existing.quantity =
          Number(existing.quantity || 0) + quantity;
      } else {
        cart.push({
          id: product.id,
          name: name,
          price: price,
          quantity: quantity
        });
      }

      try {
        localStorage.setItem(
          CART_KEY,
          JSON.stringify(cart)
        );

        messageBox.className = "success";
        messageBox.textContent =
          name + " added to your shopping cart.";
      } catch {
        messageBox.className = "error";
        messageBox.textContent =
          "Could not save your cart. Please check your browser settings.";
      }
    }

    function showProduct(product) {
      let imageHTML = "";

      if (product.image_url) {
        try {
          const imageURL = new URL(product.image_url);

          if (
            imageURL.protocol === "https:" ||
            imageURL.protocol === "http:"
          ) {
            imageHTML =
              '<img class="product-image" src="' +
              escapeHTML(imageURL.href) +
              '" alt="' +
              escapeHTML(product.name) +
              '">';
          }
        } catch {}
      }

      if (!imageHTML) {
        imageHTML =
          '<div class="product-image">No product image available</div>';
      }

      const store = product.store_name || product.store || "";

      statusBox.innerHTML = `
        <article class="product">
          <div>${imageHTML}</div>

          <div>
            <h2>${escapeHTML(product.name || "Product")}</h2>

            <p class="price">
              ${formatMoney(product.price)}
            </p>

            ${
              store
                ? `<p class="muted">Store: ${escapeHTML(store)}</p>`
                : ""
            }

            <h3>Product description</h3>

            <p class="description">${
              escapeHTML(
                product.description ||
                "No description is available for this product."
              )
            }</p>

            <label for="quantity">Quantity</label>

            <input
              id="quantity"
              type="number"
              min="1"
              max="99"
              step="1"
              value="1"
              inputmode="numeric">

            <button id="addButton" class="green" type="button">
              Add to Cart
            </button>

            <a class="button" href="./cart.html">
              View Shopping Cart
            </a>

            <a class="button" href="./index.html">
              Continue Shopping
            </a>
          </div>
        </article>
      `;

      document.getElementById("addButton").onclick = () => {
        const quantity = Number(
          document.getElementById("quantity").value
        );

        if (
          !Number.isInteger(quantity) ||
          quantity < 1 ||
          quantity > 99
        ) {
          messageBox.className = "error";
          messageBox.textContent =
            "Enter a quantity from 1 to 99.";
          return;
        }

        addToCart(product, quantity);
      };
    }

    async function loadProduct() {
      const params = new URLSearchParams(
        window.location.search
      );

      const id = params.get("id");

      if (!id || !/^[a-zA-Z0-9_-]+$/.test(id)) {
        statusBox.innerHTML = `
          <h2>No product selected</h2>
          <p>Please return to the marketplace and select a product.</p>
          <a class="button green" href="./index.html">
            Browse Marketplace
          </a>
        `;
        return;
      }

      if (!window.supabase) {
        statusBox.textContent =
          "Unable to connect. Check your internet connection and reload.";
        return;
      }

      try {
        const client = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

        const { data, error } = await client
          .from("products")
          .select("*")
          .eq("id", id)
          .maybeSingle();

        if (error) throw error;

        if (!data) {
          statusBox.innerHTML = `
            <h2>Product not found</h2>
            <p>This product may no longer be available.</p>
            <a class="button green" href="./index.html">
              Browse Marketplace
            </a>
          `;
          return;
        }

        showProduct(data);

      } catch (error) {
        console.error("Product details error:", error);

        statusBox.textContent =
          "Could not load product details. Please try again later.";
      }
    }

    loadProduct();
  </script>
</body>
</html>
