<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087443">
<title>Seller Stores | Edesvino Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6f4;
  color:#202923;
}

header{
  background:#123b2a;
  color:#fff;
  padding:24px 16px;
  text-align:center;
}

header h1{margin:0 0 8px}
header p{margin:0;line-height:1.5}

main{
  max-width:1100px;
  margin:auto;
  padding:18px 14px;
}

.panel{
  background:#fff;
  border-radius:12px;
  padding:18px;
  margin-bottom:18px;
}

nav{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}

.link{
  display:inline-block;
  background:#087443;
  color:#fff;
  text-decoration:none;
  padding:11px 14px;
  border-radius:7px;
}

.link.secondary{background:#374151}

#status{
  overflow-wrap:anywhere;
  line-height:1.5;
}

.stores{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:16px;
}

.store{
  background:#fff;
  border:1px solid #dce5de;
  border-radius:12px;
  padding:16px;
  min-width:0;
}

.store h2{
  margin:0 0 6px;
  color:#087443;
  font-size:21px;
  overflow-wrap:anywhere;
}

.muted{
  color:#657168;
  font-size:14px;
}

.products{
  display:grid;
  gap:10px;
  margin-top:14px;
}

.product{
  display:grid;
  grid-template-columns:76px minmax(0,1fr);
  gap:12px;
  align-items:center;
  border-top:1px solid #e5e7eb;
  padding-top:12px;
}

.product img{
  width:76px;
  height:76px;
  object-fit:contain;
  background:#f8faf8;
  border-radius:8px;
}

.empty-image{
  width:76px;
  height:76px;
  border-radius:8px;
  background:#edf2ee;
  display:grid;
  place-items:center;
  text-align:center;
  font-size:11px;
  color:#657168;
  padding:4px;
}

.product h3{
  font-size:16px;
  margin:0 0 5px;
  overflow-wrap:anywhere;
}

.price{
  font-weight:bold;
  color:#087443;
  margin:0 0 8px;
}

.product a{
  color:#087443;
  font-weight:bold;
  overflow-wrap:anywhere;
}

footer{
  text-align:center;
  color:#657168;
  padding:22px;
}
</style>
</head>

<body>

<header>
  <h1>Discover Seller Stores</h1>
  <p>Explore products from sellers on Edesvino Marketplace.</p>
</header>

<main>

  <section class="panel">
    <h2>Browse Our Stores</h2>
    <p>
      Explore products from participating stores.
      Select a product to see its full details.
    </p>

    <nav>
      <a class="link secondary" href="./index.html">
        Back to Marketplace
      </a>

      <a class="link" href="./become-seller.html">
        Become a Seller
      </a>
    </nav>
  </section>

  <section
    class="panel"
    id="status"
    role="status"
    aria-live="polite">
    Loading seller stores...
  </section>

  <section class="stores" id="stores"></section>

</main>

<footer>Edesvino Marketplace &copy; 2026</footer>

<script>
(function(){
"use strict";

const SUPABASE_URL =
  "https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const statusBox = document.getElementById("status");
const storesBox = document.getElementById("stores");

function safe(value){
  return String(value ?? "").replace(/[&<>"']/g, function(char){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char];
  });
}

function money(value){
  return "₦" + Number(value || 0).toLocaleString("en-NG",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function validImage(value){
  if(!value) return "";

  try{
    const url = new URL(value, window.location.href);

    if(url.protocol !== "https:" && url.protocol !== "http:"){
      return "";
    }

    return url.href;
  }catch(error){
    return "";
  }
}

async function loadStores(){
  try{
    const {data,error} = await client
      .from("products")
      .select("*")
      .order("id",{ascending:false});

    if(error) throw error;

    if(!data || data.length === 0){
      statusBox.textContent =
        "No products are available to browse yet.";
      return;
    }

    const grouped = new Map();

    data.forEach(function(product){
      const storeName = String(
        product.store_name ||
        product.store ||
        "Independent Seller"
      ).trim() || "Independent Seller";

      const sellerKey = product.seller_id
        ? String(product.seller_id)
        : "store:" + storeName.toLowerCase();

      if(!grouped.has(sellerKey)){
        grouped.set(sellerKey,{
          name:storeName,
          products:[]
        });
      }

      const group = grouped.get(sellerKey);

      if(
        group.name === "Independent Seller" &&
        storeName !== "Independent Seller"
      ){
        group.name = storeName;
      }

      group.products.push(product);
    });

    const groups = Array.from(grouped.values())
      .sort(function(a,b){
        return a.name.localeCompare(b.name);
      });

    storesBox.innerHTML = groups.map(function(group){

      const productMarkup = group.products.map(function(product){
        const image = validImage(product.image_url);

        const imageMarkup = image
          ? '<img src="' + safe(image) +
            '" alt="' + safe(product.name || "Product") +
            '" loading="lazy">'
          : '<div class="empty-image">No image available</div>';

        return `
          <article class="product">
            ${imageMarkup}

            <div>
              <h3>${safe(product.name || "Unnamed product")}</h3>

              <p class="price">${money(product.price)}</p>

              <a href="./product-details.html?id=${encodeURIComponent(
                String(product.id)
              )}">
                View Product Details
              </a>
            </div>
          </article>
        `;
      }).join("");

      return `
        <article class="store">
          <h2>${safe(group.name)}</h2>

          <p class="muted">
            ${group.products.length}
            ${group.products.length === 1 ? "product" : "products"}
          </p>

          <div class="products">
            ${productMarkup}
          </div>
        </article>
      `;
    }).join("");

    statusBox.textContent =
      "Marketplace connected. " +
      data.length + " product(s) across " +
      groups.length + " store(s).";

  }catch(error){
    console.error("Seller stores loading error:",error);

    statusBox.textContent =
      "Seller stores could not be loaded. Please check the " +
      "marketplace connection and product read permissions. " +
      "No existing data has been changed.";
  }
}

loadStores();

})();
</script>

</body>
</html>
