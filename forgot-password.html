<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14532d">

<title>Forgot Password | Edesvino Marketplace</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f3f4f6;
  font-family: Arial, sans-serif;
  color: #1f2937;
}

.container {
  width: 100%;
  max-width: 430px;
  background: white;
  padding: 28px;
  border-radius: 12px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.08);
}

h1 {
  margin-top: 0;
  font-size: 26px;
}

p {
  line-height: 1.6;
  color: #555;
}

label {
  display: block;
  margin: 18px 0 7px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border: 0;
  border-radius: 7px;
  background: #166534;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.65;
}

#message {
  margin-top: 16px;
  overflow-wrap: anywhere;
}

.links {
  text-align: center;
  margin-top: 22px;
  line-height: 2;
}

a {
  color: #166534;
}
</style>
</head>

<body>

<main class="container">

<h1>Forgot Password?</h1>

<p>
Forgot your Edesvino Marketplace password?
Enter the email address linked to your account.
We will send you a secure password-reset link.
</p>

<form id="resetRequestForm">

<label for="email">Email Address</label>

<input
  type="email"
  id="email"
  autocomplete="email"
  placeholder="Enter your registered email"
  required
>

<button type="submit" id="sendButton">
Send Reset Link
</button>

</form>

<p id="message" role="status" aria-live="polite"></p>

<div class="links">

<a href="./customer-login.html">
Back to Customer Login
</a>

<br>

<a href="./index.html">
Back to Marketplace
</a>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";

const SUPABASE_URL =
"https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

const form =
document.getElementById("resetRequestForm");

const emailInput =
document.getElementById("email");

const button =
document.getElementById("sendButton");

const message =
document.getElementById("message");

let supabaseClient = null;

try {

  if (!window.supabase) {
    throw new Error(
      "Supabase could not load. Check your internet connection."
    );
  }

  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

} catch (error) {

  message.style.color = "#b91c1c";
  message.textContent = error.message;
  button.disabled = true;

}

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  if (!supabaseClient) return;

  button.disabled = true;
  button.textContent = "Sending...";

  message.style.color = "#1f2937";
  message.textContent = "Requesting your reset link...";

  const email = emailInput.value.trim();

  const redirectTo =
    window.location.origin + "/reset-password.html";

  try {

    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo: redirectTo
        }
      );

    if (error) {
      throw error;
    }

    message.style.color = "#166534";

    message.textContent =
      "If an account is registered with that email, " +
      "a password-reset link will be sent. " +
      "Please check your inbox and spam folder.";

    form.reset();

  } catch (error) {

    message.style.color = "#b91c1c";

    message.textContent =
      "Unable to send reset link: " +
      (error.message || "Please try again.");

  } finally {

    button.disabled = false;
    button.textContent = "Send Reset Link";

  }

});

</script>

</body>
</html>
