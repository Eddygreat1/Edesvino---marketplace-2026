
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login | Edesvino Marketplace</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 27px;
    }

    .intro {
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #166534;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #message {
      margin-top: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .links {
      margin-top: 22px;
      line-height: 2;
      text-align: center;
    }

    a {
      color: #166534;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Customer Login</h1>
    <p class="intro">
      Welcome back to Edesvino Marketplace.
    </p>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Log In
      </button>

      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <div class="links">
      <div>
        Don't have an account?
        <a href="./customer-register.html">Register here</a>
      </div>
      <div>
        <a href="./index.html">Back to Marketplace</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://lxszilqypuglxyfyukdg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    let client = null;

    try {
      if (!window.supabase) {
        throw new Error(
          "Supabase did not load. Check your internet connection and reload the page."
        );
      }

      client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            storage: window.localStorage
          }
        }
      );
    } catch (error) {
      message.style.color = "#b91c1c";
      message.textContent =
        "Setup error: " + error.message;
      button.disabled = true;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!client) {
        message.style.color = "#b91c1c";
        message.textContent =
          "Login is unavailable because Supabase did not initialize.";
        return;
      }

      button.disabled = true;
      button.textContent = "Logging in...";
      message.style.color = "#1f2937";
      message.textContent = "Signing you in...";

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      try {
        const { data, error } =
          await client.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          throw error;
        }

        if (!data.session || !data.user) {
          throw new Error(
            "No login session was returned. Please try again."
          );
        }

        message.style.color = "#166534";
        message.textContent =
          "Login successful! Opening your orders...";

        button.textContent = "Opening orders...";

        window.location.href = "./customer-orders.html";

      } catch (error) {
        message.style.color = "#b91c1c";
        message.textContent =
          "Login failed: " +
          (error.message || "Please try again.");

        button.disabled = false;
        button.textContent = "Log In";
      }
    });
  </script>
</body>
</html>
