<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Edesvino Marketplace</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; font-family: Arial, sans-serif;
      background: #f3f4f6; color: #1f2937;
    }
    .container {
      max-width: 600px; margin: 20px auto; background: white;
      padding: 22px; border-radius: 12px;
      box-shadow: 0 2px 10px #00000010;
    }
    h1 { font-size: 25px; margin-top: 0; }
    h2 { font-size: 19px; margin-top: 25px; }
    .item { padding: 12px 0; border-bottom: 1px solid #e5e7eb; }
    .muted { color: #6b7280; font-size: 14px; }
    .total { font-size: 20px; font-weight: bold; margin: 18px 0; }
    label { display: block; font-weight: bold; margin: 15px 0 6px; }
    input, textarea {
      width: 100%; padding: 12px; border: 1px solid #d1d5db;
      border-radius: 7px; font-size: 16px;
    }
    textarea { min-height: 85px; resize: vertical; }
    button, .link {
      display: block; width: 100%; padding: 13px; margin-top: 15px;
      border: 0; border-radius: 7px; background: #047857;
      color: white; text-align: center; text-decoration: none;
      font-size: 16px; font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .link { background: #374151; font-weight: normal; }
    .notice { margin-top: 15px; line-height: 1.5; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main class="container">
  <h1>Edesvino Checkout</h1>
  <p class="muted">Review your items and enter your delivery details.</p>

  <h2>Your Order</h2>
  <div id="orderItems">Loading your cart...</div>
  <div class="total" id="orderTotal"></div>

  <form id="checkoutForm">
    <h2>Delivery Details</h2>

    <label for="fullName">Full Name</label>
    <input id="fullName" name="fullName" autocomplete="name" required>

    <label for="phone">Phone Number</label>
    <input id="phone" name="phone" type="tel" autocomplete="tel" required>

    <label for="address">Delivery Address</label>
    <textarea id="address" name="address"
      autocomplete="street-address" required></textarea>

    <label for="city">City or Town</label>
    <input id="city" name="city" autocomplete="address-level2" required>

    <label for="notes">Additional Delivery Instructions (Optional)</label>
    <textarea id="notes" name="notes"></textarea>

    <button id="continueButton" type="submit">
      Continue to Paystack
    </button>
  </form>

  <p id="notice" class="notice" aria-live="polite"></p>
  <a class="link" href="./cart.html">Back to Shopping Cart</a>
  <a class="link" href="./">Continue Shopping</a>
  <p class="muted">
    Payments are confirmed by the secure payment verification function.
  </p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  "use strict";

  const SUPABASE_URL =
    "https://lxszilqypuglxyfyukdg.supabase.co";
  const SUPABASE_KEY =
    "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

  const CART_KEY = "edesvinoMarketplaceCart";
  const DETAILS_KEY = "edesvinoMarketplaceCheckout";
  const PENDING_KEY = "edesvinoPendingPayment";

  const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      storage: window.localStorage
    }
  }
);


  

  const form = document.getElementById("checkoutForm");
  const button = document.getElementById("continueButton");
  const notice = document.getElementById("notice");
  const itemsBox = document.getElementById("orderItems");
  const totalBox = document.getElementById("orderTotal");

  let cart = [];
  let submitting = false;

  function money(value) {
    return Number(value).toLocaleString("en-NG", {
      style: "currency",
      currency: "NGN",
      maximumFractionDigits: 2
    });
  }

  function message(text, color = "#b91c1c") {
    notice.textContent = text;
    notice.style.color = color;
  }

  function setBusy(text) {
    button.disabled = true;
    button.textContent = text;
  }

  function loadCart() {
    try {
      const saved = JSON.parse(
        localStorage.getItem(CART_KEY) || "[]"
      );

      if (!Array.isArray(saved)) {
        throw new Error("Invalid cart");
      }

      cart = saved.filter(item =>
        item &&
        Number.isInteger(Number(item.id)) &&
        Number(item.id) > 0 &&
        typeof item.name === "string" &&
        Number.isFinite(Number(item.price)) &&
        Number(item.price) > 0 &&
        Number.isInteger(Number(item.quantity)) &&
        Number(item.quantity) > 0
      ).map(item => ({
        id: Number(item.id),
        name: item.name,
        price: Number(item.price),
        quantity: Number(item.quantity)
      }));

      itemsBox.replaceChildren();

      if (!cart.length) {
        itemsBox.textContent = "Your cart is empty.";
        totalBox.textContent = "";
        form.hidden = true;
        return;
      }

      form.hidden = false;
      let total = 0;

      cart.forEach(item => {
        const subtotal = item.price * item.quantity;
        total += subtotal;

        const row = document.createElement("div");
        row.className = "item";

        const name = document.createElement("strong");
        name.textContent = item.name;

        const details = document.createElement("div");
        details.className = "muted";
        details.textContent =
          "Quantity: " + item.quantity +
          " × " + money(item.price);

        const amount = document.createElement("div");
        amount.textContent = "Subtotal: " + money(subtotal);

        row.append(name, details, amount);
        itemsBox.appendChild(row);
      });

      totalBox.textContent = "Total: " + money(total);

    } catch (_) {
      cart = [];
      itemsBox.textContent =
        "Could not read your cart. Return to your cart page.";
      totalBox.textContent = "";
      form.hidden = true;
    }
  }

  function restoreDetails() {
    try {
      const saved = JSON.parse(
        sessionStorage.getItem(DETAILS_KEY) || "null"
      );

      if (saved) {
        ["fullName", "phone", "address", "city", "notes"]
          .forEach(key => {
            document.getElementById(key).value =
              saved[key] || "";
          });
      }
    } catch (_) {
      // Continue if saved details cannot be read.
    }
  }

  async function verifyReturnedPayment() {
    const params = new URLSearchParams(location.search);
    const reference =
      params.get("reference") || params.get("trxref");

    if (!reference) return false;

    let pending;

    try {
      pending = JSON.parse(
        localStorage.getItem(PENDING_KEY) || "null"
      );
    } catch (_) {
      pending = null;
    }

    if (
      !pending ||
      !Number.isSafeInteger(Number(pending.order_id)) ||
      Number(pending.order_id) <= 0 ||
      !pending.reference ||
      pending.reference !== reference
    ) {
      message(
        "We could not match this payment to a saved order. " +
        "Please contact the marketplace administrator."
      );
      return true;
    }

    setBusy("Verifying Payment...");
    form.hidden = true;
    message(
      "Checking your payment directly with Paystack...",
      "#374151"
    );

    try {
      const { data: sessionData, error: sessionError } =
        await db.auth.getSession();

      if (sessionError) throw sessionError;

      if (!sessionData.session) {
        message(
          "Please log in to the same customer account used " +
          "for checkout, then return to this page to verify payment."
        );
        return true;
      }

      const { data, error } = await db.functions.invoke(
        "paystack-payment",
        {
          body: {
            action: "verify",
            order_id: Number(pending.order_id),
            reference: reference
          }
        }
      );

      if (error) throw error;

      if (!data || data.success !== true) {
        throw new Error(
          data && data.message
            ? data.message
            : "Payment could not be verified."
        );
      }

      localStorage.removeItem(PENDING_KEY);
      localStorage.removeItem(CART_KEY);

      try {
        sessionStorage.removeItem(DETAILS_KEY);
      } catch (_) {}

      history.replaceState(
        {},
        document.title,
        location.pathname
      );

      loadCart();

      message(
        "Payment successful! Order #" +
        Number(pending.order_id) +
        " has been verified. Thank you for shopping with Edesvino.",
        "#047857"
      );

      return true;

    } catch (error) {
      message(
        "Payment verification is not yet confirmed. " +
        "Do not pay again. Keep your order reference and " +
        "contact the marketplace administrator. " +
        (error.message || "")
      );

      button.disabled = true;
      button.textContent = "Payment Needs Checking";
      return true;
    }
  }

  async function startCheckout(event) {
    event.preventDefault();

    if (submitting) return;

    if (!cart.length) {
      message("Your cart is empty. Add products before checkout.");
      return;
    }

    if (!form.reportValidity()) return;

    const details = {
      fullName: document.getElementById("fullName").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      address: document.getElementById("address").value.trim(),
      city: document.getElementById("city").value.trim(),
      notes: document.getElementById("notes").value.trim()
    };

    if (
      !details.fullName ||
      !details.phone ||
      !details.address ||
      !details.city
    ) {
      message("Please complete all required delivery fields.");
      return;
    }

    submitting = true;
    setBusy("Saving Order...");
    message("Checking your account and products...", "#374151");

    let orderCreated = false;

    try {
      const { data: userData, error: userError } =
        await db.auth.getUser();

      if (userError) throw userError;

      const user = userData.user;

      if (!user) {
        throw new Error(
          "Please log in to your customer account before checkout."
        );
      }

      if (!user.email) {
        throw new Error(
          "Your customer account needs an email address for Paystack."
        );
      }

      const ids = [...new Set(cart.map(item => item.id))];

      const { data: products, error: productError } = await db
        .from("products")
        .select("id,name,price,seller_id")
        .in("id", ids);

      if (productError) throw productError;

      const productMap = new Map(
        (products || []).map(p => [Number(p.id), p])
      );

      for (const item of cart) {
        const product = productMap.get(item.id);

        if (!product || !product.seller_id) {
          throw new Error(
            "A product is missing or has no seller. " +
            "Please review your cart."
          );
        }

        if (Number(product.price) !== item.price) {
          throw new Error(
            "The price of " + product.name +
            " has changed. Return to your cart and review it."
          );
        }
      }

      const total = cart.reduce((sum, item) =>
        sum + item.price * item.quantity, 0);

      if (!Number.isFinite(total) || total <= 0) {
        throw new Error("The order total is invalid.");
      }

      const firstItem = cart[0];
      const firstProduct = productMap.get(firstItem.id);

      const deliveryAddress =
        details.address + ", " + details.city +
        (details.notes
          ? " | Instructions: " + details.notes
          : "");

      const orderRecord = {
        product_name: firstProduct.name,
        product_id: firstProduct.id,
        price: Number(firstProduct.price),
        customer_name: details.fullName,
        customer_phone: details.phone,
        delivery_address: deliveryAddress,
        customer_id: user.id,
        seller_id: firstProduct.seller_id,
        status: "pending",
        total_amount: total
      };

      const { data: order, error: orderError } = await db
        .from("orders")
        .insert(orderRecord)
        .select("id")
        .single();

      if (orderError) throw orderError;

      orderCreated = true;

      const itemRecords = cart.map(item => {
        const product = productMap.get(item.id);

        return {
          order_id: order.id,
          product_id: product.id,
          product_name: product.name,
          price: Number(product.price),
          quantity: item.quantity,
          seller_id: product.seller_id
        };
      });

      const { error: itemsError } = await db
        .from("order_items")
        .insert(itemRecords);

      if (itemsError) {
        throw new Error(
          "Order #" + order.id +
          " was created, but its items could not be saved. " +
          "Do not submit another order. Contact the administrator."
        );
      }

      try {
        sessionStorage.setItem(
          DETAILS_KEY,
          JSON.stringify(details)
        );
      } catch (_) {}

      setBusy("Connecting to Paystack...");
      message(
        "Your order is saved. Preparing secure test payment...",
        "#374151"
      );

      const { data: payment, error: paymentError } =
        await db.functions.invoke("paystack-payment", {
          body: {
            action: "initialize",
            order_id: Number(order.id)
          }
        });

      if (paymentError) throw paymentError;

      if (
        !payment ||
        !payment.authorization_url ||
        !payment.reference ||
        Number(payment.order_id) !== Number(order.id)
      ) {
        throw new Error(
          "Paystack did not return a valid payment link."
        );
      }

      localStorage.setItem(
        PENDING_KEY,
        JSON.stringify({
          order_id: Number(order.id),
          reference: payment.reference
        })
      );

      message(
        "Opening Paystack's secure payment page...",
        "#047857"
      );

      location.assign(payment.authorization_url);

    } catch (error) {
      if (orderCreated) {
        message(
          "An order was created, but payment setup did not finish. " +
          "Do not submit another order until this one is checked. " +
          (error.message || "Please contact the administrator.")
        );
      } else {
        message(
          "Checkout could not continue: " +
          (error.message || "Unknown error")
        );
      }

      button.disabled = false;
      button.textContent = "Continue to Paystack";

    } finally {
      submitting = false;
    }
  }

  form.addEventListener("submit", startCheckout);

  restoreDetails();
  loadCart();

  verifyReturnedPayment().then(returned => {
    if (!returned && cart.length) {
      button.disabled = false;
      button.textContent = "Continue to Paystack";
    }
  }).catch(() => {
    message(
      "Could not check the payment return. " +
      "Please contact the marketplace administrator."
    );
  });
})();
</script>
</body>
</html>
