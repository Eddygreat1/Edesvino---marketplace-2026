<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Become a Seller | Edesvino</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 460px;
      padding: 28px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px #00000012;
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      color: #111827;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #047857;
      border-color: #047857;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 7px;
      background: #047857;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 7px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .links {
      margin-top: 20px;
      text-align: center;
      line-height: 2;
    }

    a {
      color: #047857;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Become an Edesvino Seller</h1>

    <p class="subtitle">
      Create your seller account and apply to open your store
      on Edesvino Marketplace.
    </p>

    <form id="sellerForm">
      <label for="fullName">Full Name</label>
      <input
        id="fullName"
        type="text"
        autocomplete="name"
        maxlength="100"
        placeholder="Enter your full name"
        required
      >

      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="Enter your email address"
        required
      >

      <label for="phone">Phone Number</label>
      <input
        id="phone"
        type="tel"
        autocomplete="tel"
        maxlength="25"
        placeholder="Enter your phone number"
        required
      >

      <label for="storeName">Store Name</label>
      <input
        id="storeName"
        type="text"
        maxlength="100"
        placeholder="Enter your business name"
        required
      >

      <label for="password">Create Password</label>
      <input
        id="password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        placeholder="At least 8 characters"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        placeholder="Enter your password again"
        required
      >

      <button id="submitButton" type="submit">
        Apply to Become a Seller
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="links">
      Already have an account?
      <a href="seller-dashboard.html">Seller Dashboard</a>
      <br>
      <a href="./">Back to Marketplace</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://lxszilqypuglxyfyukdg.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

    const form = document.getElementById("sellerForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    const client = window.supabase
      ? window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        )
      : null;

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.style.display = "block";
      message.style.color = isError ? "#991b1b" : "#065f46";
      message.style.background = isError ? "#fee2e2" : "#d1fae5";
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!client) {
        showMessage(
          "The registration service could not load. Check your internet connection and try again.",
          true
        );
        return;
      }

      const fullName =
        document.getElementById("fullName").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      const storeName =
        document.getElementById("storeName").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (!fullName || !email || !phone || !storeName) {
        showMessage("Please complete all the fields.", true);
        return;
      }

      if (password.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          true
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Your passwords do not match.", true);
        return;
      }

      button.disabled = true;
      button.textContent = "Submitting application...";
      message.style.display = "none";

      try {
        const { data, error } = await client.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              account_type: "seller",
              full_name: fullName,
              phone: phone,
              store_name: storeName
            },
            emailRedirectTo: new URL(
              "seller-dashboard.html",
              window.location.href
            ).href
          }
        });

        if (error) {
          throw error;
        }

        if (data.user) {
          form.reset();

          showMessage(
            "Your seller account registration was received. " +
            "If email confirmation is required, check your inbox. " +
            "Your seller application must be recorded and approved " +
            "before you can manage products."
          );
        } else {
          showMessage(
            "Registration could not be confirmed. Please try again.",
            true
          );
        }

      } catch (error) {
        console.error("Seller registration error:", error);

        showMessage(
          error.message ||
          "Registration failed. Please try again.",
          true
        );

      } finally {
        button.disabled = false;
        button.textContent = "Apply to Become a Seller";
      }
    });
  </script>
</body>
</html>
