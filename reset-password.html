<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14532d">

<title>Reset Password | Edesvino Marketplace</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f3f4f6;
  font-family: Arial, sans-serif;
  color: #1f2937;
}

.container {
  width: 100%;
  max-width: 430px;
  background: white;
  padding: 28px;
  border-radius: 12px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.08);
}

h1 {
  margin-top: 0;
  font-size: 26px;
}

p {
  line-height: 1.6;
  color: #555;
}

label {
  display: block;
  margin: 18px 0 7px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border: 0;
  border-radius: 7px;
  background: #166534;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.65;
  cursor: not-allowed;
}

#message {
  margin-top: 16px;
  overflow-wrap: anywhere;
}

.links {
  text-align: center;
  margin-top: 22px;
  line-height: 2;
}

a {
  color: #166534;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<main class="container">

<h1>Reset Your Password</h1>

<p>
Enter your new Edesvino Marketplace password below.
</p>

<div id="loadingMessage">
Checking your password-reset link...
</div>

<form id="passwordForm" class="hidden">

<label for="password">New Password</label>

<input
  type="password"
  id="password"
  autocomplete="new-password"
  placeholder="Enter new password"
  minlength="8"
  required
>

<label for="confirmPassword">Confirm New Password</label>

<input
  type="password"
  id="confirmPassword"
  autocomplete="new-password"
  placeholder="Confirm new password"
  minlength="8"
  required
>

<button type="submit" id="updateButton">
Update Password
</button>

</form>

<p id="message" role="status" aria-live="polite"></p>

<div class="links">

<a href="./customer-login.html">
Back to Customer Login
</a>

<br>

<a href="./forgot-password.html">
Request Another Reset Link
</a>

<br>

<a href="./index.html">
Back to Marketplace
</a>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";

const SUPABASE_URL =
"https://lxszilqypuglxyfyukdg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_s0nfQzd5aJVQjHSNAxsJsg_2ZVe5UQh";

const form =
document.getElementById("passwordForm");

const passwordInput =
document.getElementById("password");

const confirmInput =
document.getElementById("confirmPassword");

const button =
document.getElementById("updateButton");

const message =
document.getElementById("message");

const loading =
document.getElementById("loadingMessage");

let supabaseClient = null;
let recoverySessionReady = false;

function showMessage(text, color) {
  message.textContent = text;
  message.style.color = color;
}

function showPasswordForm() {
  recoverySessionReady = true;
  loading.classList.add("hidden");
  form.classList.remove("hidden");

  showMessage(
    "Your reset link is valid. Choose a new password.",
    "#166534"
  );
}

function showInvalidLink() {
  loading.textContent =
    "This password-reset link is invalid or has expired.";

  showMessage(
    "Please request a new reset link and try again.",
    "#b91c1c"
  );
}

async function initializeReset() {

  try {

    if (!window.supabase) {
      throw new Error(
        "Supabase could not load. Check your internet connection."
      );
    }

    supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    supabaseClient.auth.onAuthStateChange(
      async function(event, session) {

        if (
          event === "PASSWORD_RECOVERY" &&
          session
        ) {
          showPasswordForm();
        }

        if (
          event === "SIGNED_OUT" &&
          !recoverySessionReady
        ) {
          showInvalidLink();
        }

      }
    );

    const {
      data,
      error
    } = await supabaseClient.auth.getSession();

    if (error) {
      throw error;
    }

    if (data.session) {
      showPasswordForm();
    } else {

      setTimeout(function() {

        if (!recoverySessionReady) {
          showInvalidLink();
        }

      }, 1500);

    }

  } catch (error) {

    loading.textContent = "Unable to verify reset link.";

    showMessage(
      error.message || "Please try again.",
      "#b91c1c"
    );

  }

}

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  if (!supabaseClient || !recoverySessionReady) {
    showMessage(
      "Your reset session is not active. Request a new link.",
      "#b91c1c"
    );
    return;
  }

  const password = passwordInput.value;
  const confirmPassword = confirmInput.value;

  if (password.length < 8) {
    showMessage(
      "Your password must contain at least 8 characters.",
      "#b91c1c"
    );
    return;
  }

  if (password !== confirmPassword) {
    showMessage(
      "The passwords do not match.",
      "#b91c1c"
    );
    return;
  }

  button.disabled = true;
  button.textContent = "Updating...";

  showMessage(
    "Updating your password...",
    "#1f2937"
  );

  try {

    const {
      error
    } = await supabaseClient.auth.updateUser({
      password: password
    });

    if (error) {
      throw error;
    }

    showMessage(
      "Your password has been updated successfully. " +
      "You can now log in using your new password.",
      "#166534"
    );

    form.classList.add("hidden");

    passwordInput.value = "";
    confirmInput.value = "";

    recoverySessionReady = false;

  } catch (error) {

    showMessage(
      "Password update failed: " +
      (error.message || "Please try again."),
      "#b91c1c"
    );

  } finally {

    button.disabled = false;
    button.textContent = "Update Password";

  }

});

initializeReset();

</script>

</body>
</html>
